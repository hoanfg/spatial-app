<svg xmlns="http://www.w3.org/2000/svg" width="840" height="319" viewBox="0 0 840 319" role="img" aria-labelledby="title desc"><title id="title">G17 | Source-null p-value calibration</title><desc id="desc">Bao'an 8 x 8 geometry; 999 reference draws, 400 test fields. Distinct reference hypotheses; percentages evaluated under the simulated source null.</desc><rect width="840" height="319" fill="white" rx="10"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="34" font-size="23" text-anchor="start" fill="#182d3c" font-weight="600">G17 | Source-null p-value calibration</text><text x="26" y="58" font-size="14" text-anchor="start" fill="#536674" font-weight="400">Bao'an 8 x 8 geometry; 999 reference draws, 400 test fields</text><line x1="26" y1="73" x2="814" y2="73" stroke="#d7e2e9" stroke-width="1" /><rect x="26" y="84" width="13" height="13" rx="3" fill="#226a9b" stroke="none"/><text x="45" y="95" font-size="13" text-anchor="start" fill="#182d3c" font-weight="400">Cell permutation</text><rect x="416" y="84" width="13" height="13" rx="3" fill="#168077" stroke="none"/><text x="435" y="95" font-size="13" text-anchor="start" fill="#182d3c" font-weight="400">Source reference</text><line x1="210" y1="106" x2="210" y2="244" stroke="#d7e2e9" stroke-width="1" /><text x="210" y="264" font-size="12" text-anchor="middle" fill="#536674" font-weight="400">0.00</text><line x1="297.5" y1="106" x2="297.5" y2="244" stroke="#d7e2e9" stroke-width="1" /><text x="297.5" y="264" font-size="12" text-anchor="middle" fill="#536674" font-weight="400">2.00</text><line x1="385" y1="106" x2="385" y2="244" stroke="#d7e2e9" stroke-width="1" /><text x="385" y="264" font-size="12" text-anchor="middle" fill="#536674" font-weight="400">4.00</text><line x1="472.5" y1="106" x2="472.5" y2="244" stroke="#d7e2e9" stroke-width="1" /><text x="472.5" y="264" font-size="12" text-anchor="middle" fill="#536674" font-weight="400">6.00</text><line x1="560" y1="106" x2="560" y2="244" stroke="#d7e2e9" stroke-width="1" /><text x="560" y="264" font-size="12" text-anchor="middle" fill="#536674" font-weight="400">8.00</text><line x1="647.5" y1="106" x2="647.5" y2="244" stroke="#d7e2e9" stroke-width="1" /><text x="647.5" y="264" font-size="12" text-anchor="middle" fill="#536674" font-weight="400">10.00</text><line x1="735" y1="106" x2="735" y2="244" stroke="#d7e2e9" stroke-width="1" /><text x="735" y="264" font-size="12" text-anchor="middle" fill="#536674" font-weight="400">12.00</text><line x1="210" y1="106" x2="210" y2="244" stroke="#8c9ca7" stroke-width="1" /><text x="198" y="137" font-size="14" text-anchor="end" fill="#182d3c" font-weight="400">Marginal p &lt;= .05</text><rect x="210" y="113" width="461.76758" height="19" rx="3" fill="#226a9b" stroke="none"/><text x="678.76758" y="128" font-size="13" text-anchor="start" fill="#182d3c" font-weight="600">10.55%</text><rect x="210" y="138" width="226.78223" height="19" rx="3" fill="#168077" stroke="none"/><text x="443.78223" y="153" font-size="13" text-anchor="start" fill="#182d3c" font-weight="600">5.18%</text><text x="198" y="207" font-size="14" text-anchor="end" fill="#182d3c" font-weight="400">BH any rejection</text><rect x="210" y="183" width="229.6875" height="19" rx="3" fill="#226a9b" stroke="none"/><text x="446.6875" y="198" font-size="13" text-anchor="start" fill="#182d3c" font-weight="600">5.25%</text><rect x="210" y="208" width="21.875" height="19" rx="3" fill="#168077" stroke="none"/><text x="238.875" y="223" font-size="13" text-anchor="start" fill="#182d3c" font-weight="600">0.50%</text><line x1="26" y1="279" x2="814" y2="279" stroke="#d7e2e9" stroke-width="1" /><text x="26" y="302" font-size="12" text-anchor="start" fill="#536674" font-weight="400">Distinct reference hypotheses; percentages evaluated under the simulated source null.</text></g></svg>
