<svg xmlns="http://www.w3.org/2000/svg" width="840" height="389" viewBox="0 0 840 389" role="img" aria-labelledby="title desc"><title id="title">G27 | Panel key collision</title><desc id="desc">Controlled records; identical spatial and temporal key. Illustrative reconstruction of the replacement rule, not a live Streamlit regression.</desc><rect width="840" height="389" fill="white" rx="10"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="34" font-size="23" text-anchor="start" fill="#182d3c" font-weight="600">G27 | Panel key collision</text><text x="26" y="58" font-size="14" text-anchor="start" fill="#536674" font-weight="400">Controlled records; identical spatial and temporal key</text><line x1="26" y1="73" x2="814" y2="73" stroke="#d7e2e9" stroke-width="1" /><rect x="32" y="92" width="350" height="111" rx="7" fill="#f4f8fb" stroke="#226a9b"/><text x="45" y="117" font-size="17" text-anchor="start" fill="#226a9b" font-weight="600">Record A</text><text x="45" y="141" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">2020 | 500 m</text><text x="45" y="164" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">499 permutations | Raw NTL</text><rect x="458" y="92" width="350" height="111" rx="7" fill="#f4f8fb" stroke="#168077"/><text x="471" y="117" font-size="17" text-anchor="start" fill="#168077" font-weight="600">Record B</text><text x="471" y="141" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">2020 | 500 m</text><text x="471" y="164" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">999 permutations | Log NTL</text><line x1="207" y1="203" x2="207" y2="221" stroke="#536674" stroke-width="1" /><line x1="633" y1="203" x2="633" y2="221" stroke="#536674" stroke-width="1" /><line x1="207" y1="221" x2="633" y2="221" stroke="#536674" stroke-width="1" /><line x1="420" y1="221" x2="420" y2="242" stroke="#536674" stroke-width="1.6" /><line x1="415.68517" y1="234.10176" x2="420" y2="242" stroke="#536674" stroke-width="1.6" /><line x1="424.31483" y1="234.10176" x2="420" y2="242" stroke="#536674" stroke-width="1.6" /><rect x="200" y="248" width="440" height="91" rx="7" fill="#f4f8fb" stroke="#b56e16"/><text x="213" y="273" font-size="17" text-anchor="start" fill="#b56e16" font-weight="600">Same region-year-grid key</text><text x="213" y="297" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">B replaces A despite different method settings</text><line x1="26" y1="349" x2="814" y2="349" stroke="#d7e2e9" stroke-width="1" /><text x="26" y="372" font-size="12" text-anchor="start" fill="#536674" font-weight="400">Illustrative reconstruction of the replacement rule, not a live Streamlit regression.</text></g></svg>
