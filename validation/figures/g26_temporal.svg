<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" role="img" aria-labelledby="title desc"><title id="title">G26 | Missingness and false entry</title><desc id="desc">Synthetic two-period example; one baseline cell is unobserved. Illustrative entry-rate denominator; not measured economic transition.</desc><rect width="840" height="310" fill="white" rx="10"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="34" font-size="23" text-anchor="start" fill="#182d3c" font-weight="600">G26 | Missingness and false entry</text><text x="26" y="58" font-size="14" text-anchor="start" fill="#536674" font-weight="400">Synthetic two-period example; one baseline cell is unobserved</text><line x1="26" y1="73" x2="814" y2="73" stroke="#d7e2e9" stroke-width="1" /><rect x="30" y="95" width="360" height="135" rx="7" fill="#f4f8fb" stroke="#b56e16"/><text x="43" y="120" font-size="17" text-anchor="start" fill="#b56e16" font-weight="600">Legacy: 50% entry</text><text x="43" y="144" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">t0: 10 | 0 | 0 | 5</text><text x="43" y="167" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">t1: 10 | 8 | 0 | 5</text><text x="43" y="190" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">1 of 2 baseline zeros becomes positive</text><rect x="450" y="95" width="360" height="135" rx="7" fill="#f4f8fb" stroke="#168077"/><text x="463" y="120" font-size="17" text-anchor="start" fill="#168077" font-weight="600">Common support: 0% entry</text><text x="463" y="144" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">t0: 10 | NA | 0 | 5</text><text x="463" y="167" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">t1: 10 | 8 | 0 | 5</text><text x="463" y="190" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">0 of 1 observed baseline zero enters</text><line x1="394" y1="158" x2="446" y2="158" stroke="#536674" stroke-width="1.6" /><line x1="438.10176" y1="162.31483" x2="446" y2="158" stroke="#536674" stroke-width="1.6" /><line x1="438.10176" y1="153.68517" x2="446" y2="158" stroke="#536674" stroke-width="1.6" /><text x="420" y="254" font-size="14" text-anchor="middle" fill="#182d3c" font-weight="400">The missing location is excluded from the paired domain.</text><line x1="26" y1="270" x2="814" y2="270" stroke="#d7e2e9" stroke-width="1" /><text x="26" y="293" font-size="12" text-anchor="start" fill="#536674" font-weight="400">Illustrative entry-rate denominator; not measured economic transition.</text></g></svg>
