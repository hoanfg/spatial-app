name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Kiểm thử lõi (T01-T28)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy pandas scipy pytest
      - run: pytest -q tests/test_lisa_reliability.py tests/test_robustness.py
      - run: node validation/audit_public_evidence.mjs --check-result
      - run: node validation/check_docs.mjs

  ui-smoke:
    name: Kiểm thử khói giao diện (AppTest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: pytest -q tests --ignore=tests/test_lisa_reliability.py --ignore=tests/test_robustness.py

  g18-evidence:
    name: G18 synthetic evidence and support semantics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1
      - run: python validation/g18_zero_support_experiment.py --verify

  g17-evidence:
    name: G17 spatial-dependence FDR evidence
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1
      - run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python validation/g17_spatial_fdr_experiment.py --verify

  g04-evidence:
    name: G04 NTL potential construct and parameter sensitivity
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1
      - run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python validation/g04_ntl_potential_experiment.py --verify

  g05-evidence:
    name: G05 center-selection gradient sensitivity
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1
      - run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python validation/g05_ntl_center_experiment.py --verify

  g06-evidence:
    name: G06 refitted Pareto KS bootstrap and rival tails
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1
      - run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python validation/g06_pareto_tail_experiment.py --verify
