<svg xmlns="http://www.w3.org/2000/svg" width="840" height="283" viewBox="0 0 840 283" role="img" aria-labelledby="title desc"><title id="title">G20 | Aligned tile mosaic</title><desc id="desc">Schematic of integer windows from one Bao'an 2020 reference raster. Aligned offline split only; independent Earth Engine downloads remain untested.</desc><rect width="840" height="283" fill="white" rx="10"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="34" font-size="23" text-anchor="start" fill="#182d3c" font-weight="600">G20 | Aligned tile mosaic</text><text x="26" y="58" font-size="14" text-anchor="start" fill="#536674" font-weight="400">Schematic of integer windows from one Bao'an 2020 reference raster</text><line x1="26" y1="73" x2="814" y2="73" stroke="#d7e2e9" stroke-width="1" /><rect x="38" y="100" width="72" height="56" rx="1" fill="#dceaf4" stroke="#226a9b"/><text x="74" y="132" font-size="13" text-anchor="middle" fill="#182d3c" font-weight="400">Tile 1</text><rect x="114" y="100" width="72" height="56" rx="1" fill="#dceaf4" stroke="#226a9b"/><text x="150" y="132" font-size="13" text-anchor="middle" fill="#182d3c" font-weight="400">Tile 2</text><rect x="38" y="160" width="72" height="56" rx="1" fill="#dceaf4" stroke="#226a9b"/><text x="74" y="192" font-size="13" text-anchor="middle" fill="#182d3c" font-weight="400">Tile 3</text><rect x="114" y="160" width="72" height="56" rx="1" fill="#dceaf4" stroke="#226a9b"/><text x="150" y="192" font-size="13" text-anchor="middle" fill="#182d3c" font-weight="400">Tile 4</text><line x1="200" y1="160" x2="274" y2="160" stroke="#536674" stroke-width="1.6" /><line x1="266.10176" y1="164.31483" x2="274" y2="160" stroke="#536674" stroke-width="1.6" /><line x1="266.10176" y1="155.68517" x2="274" y2="160" stroke="#536674" stroke-width="1.6" /><rect x="285" y="100" width="148" height="116" rx="1" fill="#dceaf4" stroke="#226a9b"/><text x="359" y="155" font-size="16" text-anchor="middle" fill="#182d3c" font-weight="600">Mosaic</text><text x="359" y="176" font-size="13" text-anchor="middle" fill="#182d3c" font-weight="400">109 x 217 pixels</text><rect x="474" y="94" width="336" height="135" rx="7" fill="#f4f8fb" stroke="#168077"/><text x="487" y="119" font-size="17" text-anchor="start" fill="#168077" font-weight="600">Offline comparison</text><text x="487" y="143" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">8,909 finite pixels compared</text><text x="487" y="166" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">Maximum difference = 0</text><text x="487" y="189" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">Transform and finite mask: identical</text><line x1="26" y1="243" x2="814" y2="243" stroke="#d7e2e9" stroke-width="1" /><text x="26" y="266" font-size="12" text-anchor="start" fill="#536674" font-weight="400">Aligned offline split only; independent Earth Engine downloads remain untested.</text></g></svg>
