<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-labelledby="title desc"><title id="title">V11 | Three-location VIIRS agreement</title><desc id="desc">Shanghai, Bao'an and Qimen; same exported app polygons. Tolerance 0.00005 reflects CSV rounding, not sensor error; archived validation.</desc><rect width="840" height="320" rx="10" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="34" font-size="23" fill="#182d3c" font-weight="600" text-anchor="start">V11 | Three-location VIIRS agreement</text><text x="26" y="58" font-size="14" fill="#536674" font-weight="400" text-anchor="start">Shanghai, Bao'an and Qimen; same exported app polygons</text><line x1="26" y1="73" x2="814" y2="73" stroke="#d7e2e9" stroke-width="1" /><text x="40" y="109" font-size="18" fill="#182d3c" font-weight="600" text-anchor="start">17,177 cell comparisons</text><rect x="40" y="124" width="651.5049193689235" height="40" rx="2" fill="#226a9b" stroke="none" /><rect x="691.5049193689235" y="124" width="78.49508063107646" height="40" rx="2" fill="#168077" stroke="none" /><text x="365.75245968446177" y="149" font-size="15" fill="white" font-weight="600" text-anchor="middle">15,330 full cells</text><text x="730.7524596844618" y="149" font-size="14" fill="white" font-weight="600" text-anchor="middle">1,847</text><text x="40" y="209" font-size="15" fill="#182d3c" font-weight="400" text-anchor="start">Full cells within tolerance</text><text x="40" y="241" font-size="25" fill="#226a9b" font-weight="600" text-anchor="start">15,330 / 15,330</text><text x="420" y="209" font-size="15" fill="#182d3c" font-weight="400" text-anchor="start">Clipped cells within tolerance</text><text x="420" y="241" font-size="25" fill="#168077" font-weight="600" text-anchor="start">1,846 / 1,847</text><text x="420" y="267" font-size="14" fill="#b56e16" font-weight="600" text-anchor="start">1 clipped cell exceeds 0.00005</text><line x1="26" y1="280" x2="814" y2="280" stroke="#d7e2e9" stroke-width="1" /><text x="26" y="303" font-size="12" fill="#536674" font-weight="400" text-anchor="start">Tolerance 0.00005 reflects CSV rounding, not sensor error; archived validation.</text></g></svg>
