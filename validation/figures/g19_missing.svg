<svg xmlns="http://www.w3.org/2000/svg" width="840" height="302" viewBox="0 0 840 302" role="img" aria-labelledby="title desc"><title id="title">G19 | Zero-fill changes the population</title><desc id="desc">Equal-area cells; the third location is unobserved. Synthetic counterexample; the true regional mean is unknown.</desc><rect width="840" height="302" fill="white" rx="10"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="34" font-size="23" text-anchor="start" fill="#182d3c" font-weight="600">G19 | Zero-fill changes the population</text><text x="26" y="58" font-size="14" text-anchor="start" fill="#536674" font-weight="400">Equal-area cells; the third location is unobserved</text><line x1="26" y1="73" x2="814" y2="73" stroke="#d7e2e9" stroke-width="1" /><rect x="30" y="95" width="360" height="116" rx="7" fill="#f4f8fb" stroke="#226a9b"/><text x="43" y="120" font-size="17" text-anchor="start" fill="#226a9b" font-weight="600">Legacy zero-fill</text><text x="43" y="144" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">10 | 20 | 0 | 30</text><text x="43" y="167" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">Mean = 15   Gini = 0.416667</text><rect x="450" y="95" width="360" height="116" rx="7" fill="#f4f8fb" stroke="#168077"/><text x="463" y="120" font-size="17" text-anchor="start" fill="#168077" font-weight="600">Observed only</text><text x="463" y="144" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">10 | 20 | 30</text><text x="463" y="167" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">Mean = 20   Gini = 0.222222</text><line x1="394" y1="151" x2="446" y2="151" stroke="#536674" stroke-width="1.6" /><line x1="438.10176" y1="155.31483" x2="446" y2="151" stroke="#536674" stroke-width="1.6" /><line x1="438.10176" y1="146.68517" x2="446" y2="151" stroke="#536674" stroke-width="1.6" /><text x="420" y="243" font-size="16" text-anchor="middle" fill="#182d3c" font-weight="600">An unknown value is not a measured zero.</text><line x1="26" y1="262" x2="814" y2="262" stroke="#d7e2e9" stroke-width="1" /><text x="26" y="285" font-size="12" text-anchor="start" fill="#536674" font-weight="400">Synthetic counterexample; the true regional mean is unknown.</text></g></svg>
