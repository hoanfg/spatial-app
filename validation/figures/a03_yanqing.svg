<svg xmlns="http://www.w3.org/2000/svg" width="840" height="285" viewBox="0 0 840 285" role="img" aria-labelledby="title desc"><title id="title">A03 | Independent LISA classification</title><desc id="desc">Yanqing field comparison; rounded NTL and independent seed. Class disagreement is not automatically an arithmetic failure or a sensor error.</desc><rect width="840" height="285" rx="10" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="34" font-size="23" fill="#182d3c" font-weight="600" text-anchor="start">A03 | Independent LISA classification</text><text x="26" y="58" font-size="14" fill="#536674" font-weight="400" text-anchor="start">Yanqing field comparison; rounded NTL and independent seed</text><line x1="26" y1="73" x2="814" y2="73" stroke="#d7e2e9" stroke-width="1" /><text x="40" y="109" font-size="16" fill="#182d3c" font-weight="600" text-anchor="start">Final LISA class comparison</text><rect x="40" y="128" width="733.8893555742229" height="32" rx="2" fill="#226a9b" stroke="none" /><rect x="773.8893555742229" y="128" width="16.110644425777082" height="32" rx="2" fill="#b56e16" stroke="none" /><text x="40" y="205" font-size="23" fill="#226a9b" font-weight="600" text-anchor="start">8,154 matching</text><text x="450" y="205" font-size="23" fill="#b56e16" font-weight="600" text-anchor="start">179 differing</text><text x="40" y="236" font-size="15" fill="#182d3c" font-weight="400" text-anchor="start">97.85% agreement across 8,333 cells</text><line x1="26" y1="245" x2="814" y2="245" stroke="#d7e2e9" stroke-width="1" /><text x="26" y="268" font-size="12" fill="#536674" font-weight="400" text-anchor="start">Class disagreement is not automatically an arithmetic failure or a sensor error.</text></g></svg>
