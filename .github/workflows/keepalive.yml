name: keep-streamlit-awake
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app
        run: |
          python - <<'EOF'
          import sys, time
          from playwright.sync_api import sync_playwright

          URL = "https://spatial-app.streamlit.app/~/+/"
          DEADLINE = 180

          def find_app_frame(page):
              for f in page.frames:
                  try:
                      if f.locator('[data-testid="stApp"]').count() > 0:
                          return f
                  except Exception:
                      pass
              return None

          ok = False
          with sync_playwright() as p:
              b = p.chromium.launch(args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(
                  viewport={"width": 1280, "height": 720},
                  user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/124.0 Safari/537.36"),
              )
              page = ctx.new_page()
              page.on("console", lambda m: print(f"[console:{m.type}] {m.text[:200]}"))
              page.on("pageerror", lambda e: print(f"[pageerror] {e}"))
              page.on("requestfailed", lambda r: print(f"[reqfailed] {r.url[:120]} {r.failure}"))
              page.on("websocket", lambda ws: (
                  print(f"[ws open] {ws.url[:120]}"),
                  ws.on("close", lambda _: print("[ws close]")),
                  ws.on("socketerror", lambda e: print(f"[ws error] {e}")),
              ))
              try:
                  print("Đang truy cập ứng dụng...")
                  page.goto(URL, wait_until="domcontentloaded", timeout=60000)
                  start = time.time()
                  while time.time() - start < DEADLINE:
                      btn = page.get_by_role("button", name="Yes, get this app back up!")
                      if btn.count() > 0 and btn.first.is_visible():
                          print("App đang ngủ. Bấm nút đánh thức...")
                          btn.first.click()
                          page.wait_for_timeout(5000)
                          continue
                      frame = find_app_frame(page)
                      if frame is not None and (
                          frame.locator(".ntl-title").count() > 0
                          or frame.locator("h1:has-text('NTL')").count() > 0
                      ):
                          print("Đã thấy giao diện app.")
                          ok = True
                          page.wait_for_timeout(3000)
                          break
                      page.wait_for_timeout(3000)
                  if not ok:
                      print("Frames:", [f.url for f in page.frames])
                      page.screenshot(path="debug.png", full_page=True)
              except Exception as e:
                  print(f"Lỗi: {e}")
              finally:
                  b.close()
          sys.exit(0 if ok else 1)
          EOF
