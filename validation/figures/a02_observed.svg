<svg xmlns="http://www.w3.org/2000/svg" width="840" height="263" viewBox="0 0 840 263" role="img" aria-labelledby="title desc"><title id="title">A02 | Archived Bao'an observation metadata</title><desc id="desc">Field CSV integrity check; no genuinely unobserved row. Archived CSV check only; does not verify missing-observation cases.</desc><rect width="840" height="263" fill="white" rx="10"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="34" font-size="23" text-anchor="start" fill="#182d3c" font-weight="600">A02 | Archived Bao'an observation metadata</text><text x="26" y="58" font-size="14" text-anchor="start" fill="#536674" font-weight="400">Field CSV integrity check; no genuinely unobserved row</text><line x1="26" y1="73" x2="814" y2="73" stroke="#d7e2e9" stroke-width="1" /><rect x="32" y="95" width="370" height="110" rx="7" fill="#f4f8fb" stroke="#226a9b"/><text x="45" y="120" font-size="17" text-anchor="start" fill="#226a9b" font-weight="600">Observed records</text><text x="45" y="144" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">7,148 / 7,148 rows</text><text x="45" y="167" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">7,148 unique grid IDs</text><rect x="438" y="95" width="370" height="110" rx="7" fill="#f4f8fb" stroke="#168077"/><text x="451" y="120" font-size="17" text-anchor="start" fill="#168077" font-weight="600">Valid months (cell mean)</text><text x="451" y="144" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">Min 10 | Max 12</text><text x="451" y="167" font-size="14" text-anchor="start" fill="#182d3c" font-weight="400">Overall mean 11.9881</text><line x1="26" y1="223" x2="814" y2="223" stroke="#d7e2e9" stroke-width="1" /><text x="26" y="246" font-size="12" text-anchor="start" fill="#536674" font-weight="400">Archived CSV check only; does not verify missing-observation cases.</text></g></svg>
