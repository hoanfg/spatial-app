<svg xmlns="http://www.w3.org/2000/svg" width="840" height="285" viewBox="0 0 840 285" role="img" aria-labelledby="title desc"><title id="title">A04 | Gini hand-case oracles</title><desc id="desc">Finite nonnegative arrays; archived numerical checks. Empty and all-zero arrays return zero; invalid negative/nonfinite inputs raise an error.</desc><rect width="840" height="285" rx="10" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="34" font-size="23" fill="#182d3c" font-weight="600" text-anchor="start">A04 | Gini hand-case oracles</text><text x="26" y="58" font-size="14" fill="#536674" font-weight="400" text-anchor="start">Finite nonnegative arrays; archived numerical checks</text><line x1="26" y1="73" x2="814" y2="73" stroke="#d7e2e9" stroke-width="1" /><text x="205" y="119" font-size="15" fill="#182d3c" font-weight="400" text-anchor="end">[5,5,5,5]</text><rect x="222" y="102" width="1" height="24" rx="2" fill="#226a9b" stroke="none" /><text x="229" y="119" font-size="15" fill="#182d3c" font-weight="600" text-anchor="start">0.00</text><text x="205" y="164" font-size="15" fill="#182d3c" font-weight="400" text-anchor="end">[0,0,10,10]</text><rect x="222" y="147" width="450" height="24" rx="2" fill="#168077" stroke="none" /><text x="679" y="164" font-size="15" fill="#182d3c" font-weight="600" text-anchor="start">0.50</text><text x="205" y="209" font-size="15" fill="#182d3c" font-weight="400" text-anchor="end">[1,2,3,4]</text><rect x="222" y="192" width="225" height="24" rx="2" fill="#b56e16" stroke="none" /><text x="454" y="209" font-size="15" fill="#182d3c" font-weight="600" text-anchor="start">0.25</text><line x1="26" y1="245" x2="814" y2="245" stroke="#d7e2e9" stroke-width="1" /><text x="26" y="268" font-size="12" fill="#536674" font-weight="400" text-anchor="start">Empty and all-zero arrays return zero; invalid negative/nonfinite inputs raise an error.</text></g></svg>
