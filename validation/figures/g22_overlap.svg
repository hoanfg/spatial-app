<svg xmlns="http://www.w3.org/2000/svg" width="840" height="306" viewBox="0 0 840 306" role="img" aria-labelledby="title desc"><title id="title">G22 | Block intersection vs area overlap</title><desc id="desc">Synthetic coarse block with four equal-area fine cells. The block-any-overlap fraction is not the actual overlapping HH area fraction.</desc><rect width="840" height="306" rx="10" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="34" font-size="23" fill="#182d3c" font-weight="600" text-anchor="start">G22 | Block intersection vs area overlap</text><text x="26" y="58" font-size="14" fill="#536674" font-weight="400" text-anchor="start">Synthetic coarse block with four equal-area fine cells</text><line x1="26" y1="73" x2="814" y2="73" stroke="#d7e2e9" stroke-width="1" /><rect x="55" y="104" width="66" height="66" rx="2" fill="#b56e16" stroke="#a6b9c6" /><rect x="121" y="104" width="66" height="66" rx="2" fill="#e6edf2" stroke="#a6b9c6" /><rect x="55" y="170" width="66" height="66" rx="2" fill="#e6edf2" stroke="#a6b9c6" /><rect x="121" y="170" width="66" height="66" rx="2" fill="#e6edf2" stroke="#a6b9c6" /><rect x="55" y="104" width="132" height="132" rx="2" fill="none" stroke="#226a9b" stroke-width="3"/><text x="121" y="258" font-size="13" fill="#182d3c" font-weight="400" text-anchor="middle">One of four fine cells is HH</text><text x="265" y="134" font-size="16" fill="#182d3c" font-weight="400" text-anchor="start">Coarse block with any fine HH overlap</text><text x="265" y="165" font-size="27" fill="#226a9b" font-weight="600" text-anchor="start">100%</text><text x="265" y="203" font-size="16" fill="#182d3c" font-weight="400" text-anchor="start">Actual intersecting HH area</text><text x="265" y="234" font-size="27" fill="#b56e16" font-weight="600" text-anchor="start">25%</text><line x1="26" y1="266" x2="814" y2="266" stroke="#d7e2e9" stroke-width="1" /><text x="26" y="289" font-size="12" fill="#536674" font-weight="400" text-anchor="start">The block-any-overlap fraction is not the actual overlapping HH area fraction.</text></g></svg>
